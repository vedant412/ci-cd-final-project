apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: cd-pipeline
spec:
  params:
    - name: repo-url
      type: string
    - name: revision
      type: string
      default: main
    - name: image
      type: string
  workspaces:
    - name: source
  tasks:
    - name: cleanup
      taskRef:
        name: cleanup
      workspaces:
        - name: source
          workspace: source
    - name: git-clone
      runAfter: [cleanup]
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: source
          workspace: source
    - name: eslint
      runAfter: [git-clone]
      taskRef:
        name: eslint
      workspaces:
        - name: source
          workspace: source
    - name: jest
      runAfter: [eslint]
      taskRef:
        name: jest
      workspaces:
        - name: source
          workspace: source
    - name: buildah
      runAfter: [jest]
      taskRef:
        name: buildah
        kind: ClusterTask
      params:
        - name: IMAGE
          value: $(params.image)
      workspaces:
        - name: source
          workspace: source
    - name: deploy
      runAfter: [buildah]
      taskRef:
        name: deploy
      params:
        - name: image
          value: $(params.image)
      workspaces:
        - name: source
          workspace: source
